<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Dunk</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #232c4d, #0a0e1c 70%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', Roboto, system-ui, sans-serif;
    overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .stage {
    position:relative;
    width:min(100vw, calc(100vh * 0.6667));
    aspect-ratio:2/3; max-height:100vh;
  }
  canvas {
    position:absolute; inset:0; width:100%; height:100%; display:block;
    border-radius:14px; background:#0b0f1e;
    box-shadow:0 0 0 2px rgba(255,255,255,0.07), 0 24px 70px rgba(0,0,0,0.55);
  }
  .overlay {
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center; overflow-y:auto;
    background:rgba(7,9,18,0.74); backdrop-filter:blur(7px);
    border-radius:14px; color:#fff;
  }
  .hidden { display:none !important; }
  .pop { animation:pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform:scale(.82); opacity:0; } to { transform:scale(1); opacity:1; } }

  h1 {
    font-size:2.7em; letter-spacing:3px; font-weight:900; line-height:1.05;
    text-shadow:0 4px 0 rgba(0,0,0,0.35);
  }
  h1 span { color:#ff8a3d; }
  .tag { color:rgba(255,255,255,0.7); font-size:0.95em; letter-spacing:1px; margin-top:-6px; }
  .icon-ball { width:56px; height:56px; filter:drop-shadow(0 6px 14px rgba(255,107,44,0.45)); }

  .howto { display:flex; flex-direction:column; gap:9px; margin:8px 0 6px; }
  .row { display:flex; align-items:center; gap:10px; font-size:0.88em; color:rgba(255,255,255,0.85); text-align:left; }
  .row svg { width:24px; height:24px; flex:none; }
  .row b { color:#ffb020; }

  button {
    font-family:inherit; font-size:1.12em; font-weight:800; letter-spacing:2px;
    color:#fff; background:linear-gradient(180deg,#ff8a3d,#e8541a);
    border:none; padding:15px 54px; border-radius:999px; cursor:pointer;
    box-shadow:0 6px 0 #a83c10, 0 14px 30px rgba(232,84,26,0.35);
    transition:transform .08s; touch-action:manipulation;
  }
  button:hover { transform:translateY(-2px); }
  button:active { transform:translateY(3px); box-shadow:0 2px 0 #a83c10; }
  button.ghost {
    background:rgba(255,255,255,0.07);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,0.22), 0 5px 0 rgba(255,255,255,0.05);
  }
  .best { font-size:0.9em; letter-spacing:1.5px; color:rgba(255,255,255,0.65); }
  .best b { color:#ffb020; font-size:1.1em; }
  .rank-ladder { display:flex; flex-direction:column; align-items:center; gap:4px; margin:2px 0 2px; }
  .rl-dots { display:flex; gap:14px; }
  .rl-dot { width:15px; height:15px; border-radius:50%; box-shadow:0 0 10px rgba(255,255,255,0.3); }
  .rl-rookie { background:radial-gradient(circle at 32% 28%, #596175, #262b37); }
  .rl-bronze { background:radial-gradient(circle at 32% 28%, #f0a878, #8f5320); }
  .rl-silver { background:radial-gradient(circle at 32% 28%, #f3f6fa, #93a0b3); }
  .rl-gold { background:radial-gradient(circle at 32% 28%, #ffe88a, #c98f10); }
  .rl-platinum { background:radial-gradient(circle at 32% 28%, #ffffff, #8fa3bb); }
  .rl-diamond { background:radial-gradient(circle at 32% 28%, #d9f6ff, #1e8fc7); }
  .rl-master { background:radial-gradient(circle at 32% 28%, #ecd9ff, #6a1fb8); box-shadow:0 0 12px rgba(180,100,255,0.8); }
  .rl-names { font-size:0.55em; letter-spacing:1px; color:rgba(255,255,255,0.5); }
  .credit { position:absolute; bottom:12px; left:0; right:0; font-size:0.72em; letter-spacing:1px; color:rgba(255,255,255,0.35); }

  #hud { position:absolute; top:0; left:0; right:0; z-index:4; pointer-events:none; }
  #score {
    text-align:center; padding-top:16px; font-size:3em; font-weight:900; color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,0.35), 0 0 26px rgba(255,107,44,0.6);
  }
  #bestHud {
    position:absolute; top:22px; right:16px; font-size:0.82em; letter-spacing:1.5px;
    color:rgba(255,255,255,0.6);
  }
  #bestHud b { color:#ffb020; }
  #ready {
    text-align:center; margin-top:10px; font-size:1.05em; font-weight:700; letter-spacing:2px;
    color:#ffb020; animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1; transform:translateY(0);} 50%{opacity:.55; transform:translateY(-4px);} }

  h2 { font-size:2em; letter-spacing:3px; font-weight:900; text-shadow:0 4px 0 rgba(0,0,0,0.35); }
  .medal-wrap { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .rank-label { font-size:0.66em; letter-spacing:7px; font-weight:700; color:rgba(255,255,255,0.45); }
  .medal {
    position:relative; width:110px; height:150px;
    display:flex; align-items:flex-end; justify-content:center;
    animation:medalIn .75s cubic-bezier(.18,1.4,.4,1) both;
  }
  @keyframes medalIn {
    0% { transform:rotate(-28deg) scale(.35) translateY(-30px); opacity:0; }
    55% { transform:rotate(9deg) scale(1.1); opacity:1; }
    75% { transform:rotate(-4deg) scale(.96); }
    100% { transform:rotate(0deg) scale(1); }
  }
  .medal-ribbon {
    position:absolute; top:0; left:50%; width:68px; height:56px;
    transform:translateX(-50%); z-index:0; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.35));
  }
  .medal-ribbon::before, .medal-ribbon::after { content:''; position:absolute; top:0; width:26px; height:72px; }
  .medal-ribbon::before {
    left:7px; background:linear-gradient(180deg, var(--ribbon1), var(--ribbon2));
    clip-path:polygon(0 0, 100% 0, 100% 100%, 0 60%);
    transform:rotate(-14deg); transform-origin:top center;
  }
  .medal-ribbon::after {
    right:7px; background:linear-gradient(180deg, var(--ribbon1), var(--ribbon2));
    clip-path:polygon(0 0, 100% 0, 100% 60%, 0 100%);
    transform:rotate(14deg); transform-origin:top center;
  }
  .medal-coin {
    width:110px; height:110px; border-radius:50%; position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 32% 26%, var(--c1), var(--c2) 55%, rgba(8,10,18,0.95) 145%);
    box-shadow:
      inset 0 0 0 5px rgba(255,255,255,0.28),
      inset 0 0 0 9px rgba(0,0,0,0.3),
      inset 0 -18px 30px rgba(0,0,0,0.4),
      0 14px 36px rgba(0,0,0,0.55),
      0 0 48px var(--glow);
  }
  .medal-ball { width:48px; height:48px; filter:drop-shadow(0 3px 6px rgba(0,0,0,0.45)); }
  .medal-shine { position:absolute; inset:0; border-radius:50%; overflow:hidden; pointer-events:none; }
  .medal-shine::after {
    content:''; position:absolute; top:-70%; left:0; width:46%; height:240%;
    background:linear-gradient(115deg, transparent 32%, rgba(255,255,255,0.4) 50%, transparent 68%);
    animation:shine 3.4s ease-in-out infinite;
  }
  @keyframes shine { 0% { transform:translateX(-140%) rotate(6deg); } 55%,100% { transform:translateX(320%) rotate(6deg); } }
  .rank-name {
    font-size:1.3em; font-weight:900; letter-spacing:6px;
    text-shadow:0 0 20px var(--glow); margin-top:4px;
  }
  .rank-progress {
    width:164px; height:7px; border-radius:99px;
    background:rgba(255,255,255,0.12); overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.45);
  }
  #rankBar {
    height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg, var(--c1), var(--c2));
    box-shadow:0 0 12px var(--glow);
    transition:width .7s cubic-bezier(.2,1,.3,1);
  }
  .rank-next { font-size:0.7em; letter-spacing:2.5px; font-weight:600; color:rgba(255,255,255,0.55); }
  .final { display:flex; gap:34px; margin:4px 0 8px; }
  .final div { display:flex; flex-direction:column; gap:2px; font-size:0.78em; letter-spacing:2px; color:rgba(255,255,255,0.65); }
  .final b { font-size:2.1em; letter-spacing:1px; color:#fff; }
  .final b.gold { color:#ffb020; text-shadow:0 0 18px rgba(255,176,32,0.55); }
</style>
</head>
<body>
<div class="stage">
  <canvas id="game" width="480" height="720"></canvas>

  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="bestHud">BEST <b id="bestHudVal">0</b></div>
    <div id="ready">TAP TO START</div>
  </div>

  <div id="menu" class="overlay">
    <svg class="icon-ball" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" fill="#ff6b2c" stroke="#b23b0e" stroke-width="2.5"/>
      <path d="M24 2v44" stroke="#4a1c08" stroke-width="2" opacity=".75"/>
      <path d="M5 14c9 6 29 6 38 0M5 34c9-6 29-6 38 0" stroke="#4a1c08" stroke-width="2" opacity=".75"/>
      <ellipse cx="13" cy="24" rx="7" ry="17" stroke="#4a1c08" stroke-width="1.6" opacity=".6" transform="rotate(-18 13 24)"/>
      <ellipse cx="35" cy="24" rx="7" ry="17" stroke="#4a1c08" stroke-width="1.6" opacity=".6" transform="rotate(18 35 24)"/>
    </svg>
    <h1>FLAPPY <span>DUNK</span></h1>
    <p class="tag">Dribble the ball through the hoops</p>
    <div class="howto">
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="5" fill="#ff8a3d" stroke="#a83c10" stroke-width="1.6"/>
          <path d="M9 13v7l3-3 3 3v-7" stroke="#ff8a3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 9a9 9 0 0 1 2-3M21 9a9 9 0 0 0-2-3" stroke="rgba(255,255,255,.5)" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span><b>TAP</b> / click / space to flap</span>
      </div>
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="7" stroke="#ff6b2c" stroke-width="2.6"/>
          <path d="M5 18l3.5-2.5M19 18l-3.5-2.5" stroke="rgba(255,255,255,.75)" stroke-width="1.6" stroke-linecap="round"/>
          <rect x="3" y="3" width="18" height="4" rx="1.5" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.5)" stroke-width="1.2"/>
        </svg>
        <span>Pass through the <b>ring</b></span>
      </div>
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3 22 20H2L12 3Z" fill="rgba(255,80,80,.9)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M12 9v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="17" r="1.3" fill="#fff"/>
        </svg>
        <span>Don't hit rim or backboard</span>
      </div>
    </div>
    <button id="playBtn">PLAY</button>
    <div class="best">BEST <b id="menuBest">0</b></div>
    <div class="rank-ladder">
      <div class="rl-dots">
        <span class="rl-dot rl-rookie" title="ROOKIE"></span>
        <span class="rl-dot rl-bronze" title="BRONZE"></span>
        <span class="rl-dot rl-silver" title="SILVER"></span>
        <span class="rl-dot rl-gold" title="GOLD"></span>
        <span class="rl-dot rl-platinum" title="PLATINUM"></span>
        <span class="rl-dot rl-diamond" title="DIAMOND"></span>
        <span class="rl-dot rl-master" title="MASTER"></span>
      </div>
      <div class="rl-names">ROOKIE · BRONZE · SILVER · GOLD · PLATINUM · DIAMOND · MASTER</div>
    </div>
    <div class="credit">MADE BY DREN PALOI</div>
  </div>

  <div id="over" class="overlay hidden">
    <h2>GAME OVER</h2>
    <div class="medal-wrap">
      <div class="rank-label">RANK</div>
      <div id="medal" class="medal">
        <div class="medal-ribbon"></div>
        <div class="medal-coin" id="medalCoin">
          <svg class="medal-ball" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="21" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.95)" stroke-width="2.6"/>
            <path d="M24 3v42" stroke="rgba(255,255,255,0.9)" stroke-width="2" opacity=".8"/>
            <path d="M6 15c8.5 5.5 27.5 5.5 36 0M6 33c8.5-5.5 27.5-5.5 36 0" stroke="rgba(255,255,255,0.9)" stroke-width="2" opacity=".8"/>
            <ellipse cx="14" cy="24" rx="6.5" ry="16" stroke="rgba(255,255,255,0.7)" stroke-width="1.6" opacity=".6" transform="rotate(-18 14 24)"/>
            <ellipse cx="34" cy="24" rx="6.5" ry="16" stroke="rgba(255,255,255,0.7)" stroke-width="1.6" opacity=".6" transform="rotate(18 34 24)"/>
          </svg>
          <div class="medal-shine"></div>
        </div>
      </div>
      <div class="rank-name" id="medalName">GOLD</div>
      <div class="rank-progress"><div id="rankBar"></div></div>
      <div class="rank-next" id="rankNext">NEXT: PLATINUM IN 10 PTS</div>
    </div>
    <div class="final">
      <div>SCORE <b id="finalScore">0</b></div>
      <div>BEST <b id="finalBest">0</b></div>
    </div>
    <button id="againBtn">PLAY AGAIN</button>
    <button id="menuBtn" class="ghost">MENU</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- canvas ---------- */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 480, H = 720;
var TAU = Math.PI * 2;

/* ---------- constants (per frame @60fps, fixed timestep) ---------- */
var BALL_X = 150, BALL_R = 13;
var GRAV = 0.38, FLAP = -5.6, MAX_VY = 11;
var HOOPSPEED = 2.6;
var RING_R = 66, RING_W = 5, BB_W = 46, SPAWN_DIST = 290;
var FLOOR_H = 64;
var GAP_MIN = 0; /* panels derive from ring size */

/* ---------- state ---------- */
var state = 'menu';          /* menu | ready | playing | over */
var ball = { y: H * 0.42, vy: 0, rot: 0, squash: 0, trail: [] };
var hoops = [];
var particles = [];
var floaters = [];
var motes = [];
var score = 0, best = 0;
var speedMult = 1;
var shake = 0, flashT = 0, readyBobT = 0;
var overTimer = null;

/* ---------- best score ---------- */
function loadBest() {
  try { return parseInt(localStorage.getItem('flappyDunkBest') || '0', 10) || 0; }
  catch (e) { return 0; }
}
function saveBest() {
  try { localStorage.setItem('flappyDunkBest', String(best)); } catch (e) {}
}
best = loadBest();

/* ---------- audio ---------- */
var AC = null, master = null;
function initAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = 0.6;
      master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') {
    try { AC.resume(); } catch (e) {}
  }
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (!AC) return;
  var t0 = AC.currentTime + (delay || 0);
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, delay, freq0, freq1) {
  if (!AC) return;
  var t0 = AC.currentTime + (delay || 0);
  var len = Math.max(1, Math.floor(AC.sampleRate * dur));
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var n = AC.createBufferSource(); n.buffer = buf;
  var f = AC.createBiquadFilter();
  if (freq0 !== undefined) {
    f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(freq0, t0);
    if (freq1) f.frequency.exponentialRampToValueAtTime(freq1, t0 + dur);
  } else {
    f.type = 'lowpass'; f.frequency.value = 900;
  }
  var g = AC.createGain(); g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  n.connect(f); f.connect(g); g.connect(master);
  n.start(t0);
}
function sfxFlap() { tone(320, 0.08, 'square', 0.16, 520); }
function sfxDunk() {
  /* swoosh: noise sweeping up through the net */
  noise(0.24, 0.42, 0, 500, 2800);
  /* deep thump of the dunk */
  tone(120, 0.26, 'sine', 0.42, 55);
  /* rising chime */
  tone(523, 0.1, 'triangle', 0.2, null, 0.03);
  tone(784, 0.12, 'triangle', 0.18, null, 0.1);
  tone(1046, 0.18, 'triangle', 0.16, null, 0.17);
}
function sfxHit() { tone(150, 0.3, 'sawtooth', 0.24, 50); noise(0.22, 0.24); }

/* ---------- DOM ---------- */
var hud = document.getElementById('hud');
var scoreEl = document.getElementById('score');
var bestHudVal = document.getElementById('bestHudVal');
var readyEl = document.getElementById('ready');
var menuEl = document.getElementById('menu');
var overEl = document.getElementById('over');
var menuBestEl = document.getElementById('menuBest');
var finalScoreEl = document.getElementById('finalScore');
var finalBestEl = document.getElementById('finalBest');
var medalEl = document.getElementById('medal');
var medalNameEl = document.getElementById('medalName');

function updateScore() {
  scoreEl.textContent = score;
  bestHudVal.textContent = best;
}
function showOverlay() {
  hud.classList.add('hidden');
  overEl.classList.remove('hidden');
  overEl.classList.remove('pop');
  void overEl.offsetWidth;
  overEl.classList.add('pop');
}
function hideOverlays() {
  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
}

/* ---------- input ---------- */
function flap() {
  initAudio();
  if (state === 'ready') {
    state = 'playing';
    readyEl.classList.add('hidden');
  }
  if (state !== 'playing') return;
  ball.vy = FLAP;
  ball.squash = Math.max(ball.squash, 0.5);
  sfxFlap();
}
window.addEventListener('pointerdown', function () {
  initAudio();
  if (state === 'menu' || state === 'over') return;
  flap();
});
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    initAudio();
    if (state === 'menu' || state === 'over') return;
    flap();
  }
});
document.getElementById('playBtn').addEventListener('click', function () { initAudio(); startGame(); });
document.getElementById('againBtn').addEventListener('click', function () { initAudio(); startGame(); });
document.getElementById('menuBtn').addEventListener('click', function () { goMenu(); });

/* ---------- game flow ---------- */
function startGame() {
  if (overTimer) { clearTimeout(overTimer); overTimer = null; }
  hideOverlays();
  hud.classList.remove('hidden');
  readyEl.classList.remove('hidden');
  score = 0; speedMult = 1; shake = 0; flashT = 0;
  ball.y = H * 0.42; ball.vy = 0; ball.rot = 0; ball.squash = 0; ball.trail = [];
  hoops = []; particles = []; floaters = [];
  spawnHoop(W + 170);
  updateScore();
  state = 'ready';
}
function goMenu() {
  state = 'menu';
  hud.classList.add('hidden');
  overEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
  menuBestEl.textContent = best;
  hoops = []; particles = []; floaters = [];
  ball.y = H * 0.42; ball.vy = 0; ball.rot = 0; ball.trail = [];
}
function gameOver() {
  if (state !== 'playing') return;
  state = 'over';
  shake = 16;
  sfxHit();
  burst(BALL_X, ball.y, 16);
  if (score > best) { best = score; saveBest(); }
  finalScoreEl.textContent = score;
  finalBestEl.textContent = best;
  if (score > best) finalScoreEl.classList.add('gold'); else finalScoreEl.classList.remove('gold');
  setMedal();
  overTimer = setTimeout(showOverlay, 750);
}

/* ---------- ranks / medals ---------- */
var RANKS = [
  { min: 50, name: 'MASTER',   c1: '#ecd9ff',  c2: '#6a1fb8', glow: 'rgba(180,100,255,0.65)',  ribbon1: '#d3a8ff', ribbon2: '#4d1289' },
  { min: 40, name: 'DIAMOND',  c1: '#d9f6ff',  c2: '#1e8fc7', glow: 'rgba(80,205,255,0.6)',    ribbon1: '#a5e9ff', ribbon2: '#0f6f9e' },
  { min: 30, name: 'PLATINUM', c1: '#ffffff',  c2: '#8fa3bb', glow: 'rgba(190,215,255,0.6)',   ribbon1: '#eef3f9', ribbon2: '#8b9db5' },
  { min: 20, name: 'GOLD',     c1: '#ffe88a',  c2: '#c98f10', glow: 'rgba(255,198,60,0.6)',    ribbon1: '#ffd76e', ribbon2: '#a87a0c' },
  { min: 10, name: 'SILVER',   c1: '#f3f6fa',  c2: '#93a0b3', glow: 'rgba(205,220,240,0.55)',  ribbon1: '#e6ebf2', ribbon2: '#7c8aa0' },
  { min: 5,  name: 'BRONZE',   c1: '#f0a878',  c2: '#8f5320', glow: 'rgba(245,150,80,0.5)',    ribbon1: '#e09a63', ribbon2: '#71400f' }
];
function rankFor(s) {
  for (var i = 0; i < RANKS.length; i++) if (s >= RANKS[i].min) return RANKS[i];
  return null;
}
function setMedal() {
  var r = rankFor(score);
  var next = null;
  for (var i = RANKS.length - 1; i >= 0; i--) { if (RANKS[i].min > score) { next = RANKS[i]; break; } }
  var v = r || { c1: '#596175', c2: '#262b37', glow: 'rgba(120,132,158,0.4)', ribbon1: '#4a5264', ribbon2: '#232833', name: 'ROOKIE' };

  var coin = document.getElementById('medalCoin');
  coin.style.setProperty('--c1', v.c1);
  coin.style.setProperty('--c2', v.c2);
  coin.style.setProperty('--glow', v.glow);
  document.querySelector('.medal-ribbon').style.setProperty('--ribbon1', v.ribbon1);
  document.querySelector('.medal-ribbon').style.setProperty('--ribbon2', v.ribbon2);

  medalNameEl.textContent = r ? r.name : 'ROOKIE';
  medalNameEl.style.color = v.c1;
  medalNameEl.style.setProperty('--glow', v.glow);

  var pct, txt;
  if (!r) { pct = score / 5 * 100; txt = (5 - score) + ' PTS TO BRONZE'; }
  else if (!next) { pct = 100; txt = 'MAX RANK — UNSTOPPABLE'; }
  else { pct = (score - r.min) / (next.min - r.min) * 100; txt = 'NEXT: ' + next.name + ' IN ' + (next.min - score) + ' PTS'; }
  document.getElementById('rankBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
  document.getElementById('rankNext').textContent = txt;
}

/* ---------- hoops ---------- */
function spawnHoop(x) {
  var base = 170 + Math.random() * (H - FLOOR_H - 170 - 170); /* 170..520 */
  var amp = score >= 8 ? 42 : (score >= 3 ? 24 : 0);
  hoops.push({ x: x, base: base, cy: base, t: Math.random() * TAU, amp: amp, scored: false, scaleT: 0 });
}
function hoopAmp() { return score >= 8 ? 42 : (score >= 3 ? 24 : 0); }

/* ---------- particles / floaters / motes ---------- */
function burst(x, y, n) {
  var colors = ['#ff6b2c', '#ffb020', '#ff8a3d', '#ff3b3b', '#ffffff'];
  for (var i = 0; i < n; i++) {
    var a = Math.random() * TAU, sp = 1.5 + Math.random() * 4;
    particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
      g: 0.12, life: 24 + Math.random() * 18,
      r: 2 + Math.random() * 3.5, c: colors[i % colors.length]
    });
  }
}
for (var mi = 0; mi < 26; mi++) {
  motes.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.25, vy: 0.15 + Math.random() * 0.3,
    r: 1 + Math.random() * 2.2, a: 0.05 + Math.random() * 0.14
  });
}

/* ---------- collision helpers ---------- */
function ballRect(rx0, ry0, rx1, ry1) {
  return BALL_X + BALL_R > rx0 && BALL_X - BALL_R < rx1 && ball.y + BALL_R > ry0 && ball.y - BALL_R < ry1;
}

/* ---------- update (fixed 60fps step) ---------- */
function update() {
  if (flashT > 0) flashT--;
  if (shake > 0) shake *= 0.88;
  if (ball.squash > 0) ball.squash *= 0.9;

  for (var i = motes.length - 1; i >= 0; i--) {
    var m = motes[i];
    m.x += m.vx; m.y -= m.vy;
    if (m.y < -12) { m.y = H + 12; m.x = Math.random() * W; }
  }

  if (state === 'ready') {
    readyBobT++;
    ball.y = H * 0.42 + Math.sin(readyBobT * 0.055) * 9;
    ball.rot = Math.sin(readyBobT * 0.055) * 0.12;
  }

  if (state === 'playing' || state === 'over') {
    ball.vy = Math.min(ball.vy + GRAV, MAX_VY);
    ball.y += ball.vy;
    ball.rot += ball.vy * 0.006 + 0.02;
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy) * 0.5; }
    if (ball.y > H - FLOOR_H - BALL_R) {
      if (state === 'playing') { window.__crash = { t: 'floor', y: ball.y }; gameOver(); }
      ball.y = H - FLOOR_H - BALL_R;
      ball.vy = -Math.abs(ball.vy) * 0.45;
    }
    ball.trail.push({ x: BALL_X, y: ball.y });
    if (ball.trail.length > 14) ball.trail.shift();
  }

  if (state === 'playing') {
    for (var j = hoops.length - 1; j >= 0; j--) {
      var h = hoops[j];
      h.x -= HOOPSPEED * speedMult;
      h.t += 0.028 * speedMult;
      h.amp = hoopAmp();
      h.cy = h.base + Math.sin(h.t) * h.amp;

      if (!h.scored && h.x < BALL_X - 22) {
        h.scored = true;
        addScore(h);
      }

      if (h.scored) {
        /* ring shrinks after the ball passes through */
        if (h.scaleT < 1) h.scaleT = Math.min(1, h.scaleT + 1 / 22);
        if (h.x < -170) { hoops.splice(j, 1); continue; }
        continue; /* no collision once the ball is through */
      }

      if (h.x < -170) { hoops.splice(j, 1); continue; }

      if (h.x > BALL_X - RING_R - BALL_R - 24 && h.x < BALL_X + RING_R + BALL_R + 24) {
        if (ballRect(h.x - BB_W / 2, -40, h.x + BB_W / 2, h.cy - RING_R + 5)) { window.__crash = { t: 'top-panel', hx: h.x, cy: h.cy, y: ball.y }; gameOver(); }
        else if (ballRect(h.x - BB_W / 2, h.cy + RING_R - 5, h.x + BB_W / 2, H - FLOOR_H + 20)) { window.__crash = { t: 'bottom-panel', hx: h.x, cy: h.cy, y: ball.y }; gameOver(); }
        else {
          /* rim collision = horizontal top/bottom bands of the ring (like a pipe gap).
             The ball must stay between them; the side arcs are open like a real hoop. */
          var dxb = BALL_X - h.x;
          if (Math.abs(dxb) < RING_R - RING_W) {
            if (ball.y + BALL_R > h.cy - RING_R && ball.y - BALL_R < h.cy - RING_R + RING_W) { window.__crash = { t: 'rim-top', hx: h.x, cy: h.cy, y: ball.y }; gameOver(); }
            else if (ball.y - BALL_R < h.cy + RING_R && ball.y + BALL_R > h.cy + RING_R - RING_W) { window.__crash = { t: 'rim-bottom', hx: h.x, cy: h.cy, y: ball.y }; gameOver(); }
          }
        }
        if (state !== 'playing') break;
      }
    }
    if (state === 'playing' && (!hoops.length || hoops[hoops.length - 1].x < W - SPAWN_DIST)) {
      spawnHoop(W + 90);
    }
  }

  if (state === 'over') {
    for (var k = hoops.length - 1; k >= 0; k--) {
      hoops[k].x -= HOOPSPEED * speedMult;
      if (hoops[k].x < -170) hoops.splice(k, 1);
    }
  }

  for (var p = particles.length - 1; p >= 0; p--) {
    var pt = particles[p];
    pt.life--;
    if (pt.life <= 0) { particles.splice(p, 1); continue; }
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.g; pt.vx *= 0.98;
  }
  for (var f = floaters.length - 1; f >= 0; f--) {
    var fl = floaters[f];
    fl.life--;
    fl.y -= 1.1;
    if (fl.life <= 0) floaters.splice(f, 1);
  }
}

function addScore(h) {
  if (state !== 'playing') return;
  score++;
  speedMult = 1 + Math.min(score * 0.012, 0.55);
  ball.squash = 1;
  flashT = 55;
  burst(BALL_X, ball.y, 10);
  floaters.push({ x: h.x + 34, y: h.cy - 44, life: 42, txt: '+1' });
  initAudio();
  sfxDunk();
  updateScore();
}

/* ---------- draw ---------- */
function drawArena() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#182038');
  g.addColorStop(0.55, '#10162a');
  g.addColorStop(1, '#0b0f1e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* stands dots (crowd) */
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  for (var sy = 30; sy < 130; sy += 13) {
    for (var sx = 18 + (sy % 26); sx < W; sx += 30) {
      ctx.beginPath();
      ctx.arc(sx, sy, 2.4, 0, TAU);
      ctx.fill();
    }
  }
  var g2 = ctx.createLinearGradient(0, 128, 0, 210);
  g2.addColorStop(0, 'rgba(255,255,255,0.06)');
  g2.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 128, W, 82);

  /* spotlight */
  var sg = ctx.createRadialGradient(W / 2, H * 0.22, 40, W / 2, H * 0.22, 380);
  sg.addColorStop(0, 'rgba(255,255,255,0.07)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, H);

  /* floor */
  var fy = H - FLOOR_H;
  var fg = ctx.createLinearGradient(0, fy, 0, H);
  fg.addColorStop(0, '#96602c');
  fg.addColorStop(1, '#5e3a16');
  ctx.fillStyle = fg;
  ctx.fillRect(0, fy, W, FLOOR_H);

  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(W / 2, H + 40, 250, Math.PI, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W * 0.13, H - 6); ctx.lineTo(W * 0.87, H - 6); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W / 2, H + 6, 90, Math.PI, 0); ctx.stroke();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawGlass(x0, y0, x1, y1) {
  ctx.fillStyle = 'rgba(205,225,255,0.10)';
  ctx.strokeStyle = 'rgba(205,225,255,0.5)';
  ctx.lineWidth = 3;
  roundRectPath(x0, y0, x1 - x0, y1 - y0, 9);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x0 + 8, y1 - 10);
  ctx.lineTo(x1 - 8, y0 + 10);
  ctx.stroke();
}

function drawHoop(h) {
  var x = h.x, cy = h.cy;

  var s = 1, a = 1;
  if (h.scored) {
    /* pop up a little, then shrink to nothing */
    var t = h.scaleT;
    if (t < 0.4) s = 1 + 0.3 * (t / 0.4);
    else s = 1.3 * (1 - (t - 0.4) / 0.6);
    a = t < 0.7 ? 1 : Math.max(0, 1 - (t - 0.7) / 0.3);
  }

  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x, cy);
  ctx.scale(s, s);
  ctx.translate(-x, -cy);

  var near = Math.abs(BALL_X - x) < 170 && !h.scored;
  if (near && state === 'playing') {
    var rg = ctx.createRadialGradient(x, cy, 10, x, cy, RING_R + 34);
    rg.addColorStop(0, 'rgba(255,150,60,0.28)');
    rg.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, cy, RING_R + 34, 0, TAU); ctx.fill();
  }

  drawGlass(x - BB_W / 2, -30, x + BB_W / 2, cy - RING_R + 6);
  drawGlass(x - BB_W / 2, cy + RING_R - 6, x + BB_W / 2, H - FLOOR_H + 20);

  /* rim */
  ctx.lineWidth = RING_W * 2;
  ctx.strokeStyle = '#ff6b2c';
  ctx.beginPath(); ctx.arc(x, cy, RING_R, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(x, cy, RING_R - 5, -2.4, -0.7); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#c24610';
  ctx.beginPath(); ctx.arc(x, cy, RING_R - RING_W, -2.4, -0.7); ctx.stroke();

  /* net */
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.6;
  var netLen = RING_R + 22;
  for (var n = -3; n <= 3; n++) {
    var a = Math.PI / 2 + n * 0.28;
    var sx = x + Math.cos(a) * RING_R;
    var sy = cy + Math.sin(a) * RING_R;
    var ex = x + n * 7.5;
    var ey = cy + netLen;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(x + n * 5, cy + (netLen + RING_R) / 2 + 4, ex, ey);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x - 22, cy + netLen - 1);
  ctx.lineTo(x + 22, cy + netLen - 1);
  ctx.stroke();

  ctx.restore();
}

function drawBall() {
  var s = 1 + ball.squash * 0.35;
  ctx.save();
  ctx.translate(BALL_X, ball.y);
  ctx.rotate(ball.rot);
  ctx.scale(s, 2 - s);

  var g = ctx.createRadialGradient(-4, -4, 2, 0, 0, BALL_R + 2);
  g.addColorStop(0, '#ffa14d');
  g.addColorStop(0.6, '#ef6a1d');
  g.addColorStop(1, '#a83c10');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, TAU); ctx.fill();

  ctx.strokeStyle = 'rgba(45,20,8,0.85)';
  ctx.lineWidth = 1.7;
  ctx.beginPath(); ctx.ellipse(0, 0, BALL_R, BALL_R * 0.24, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-BALL_R * 0.72, 0, BALL_R * 0.36, BALL_R * 0.95, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(BALL_R * 0.72, 0, BALL_R * 0.36, BALL_R * 0.95, 0, 0, TAU); ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawArena();

  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    ctx.fillStyle = 'rgba(255,255,255,' + m.a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
  for (var j = 0; j < hoops.length; j++) drawHoop(hoops[j]);

  for (var f = 0; f < floaters.length; f++) {
    var fl = floaters[f];
    var fa = Math.min(1, fl.life / 20);
    ctx.font = '800 20px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,200,80,' + fa.toFixed(2) + ')';
    ctx.fillText(fl.txt, fl.x, fl.y);
  }

  for (var p = 0; p < particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.min(1, pt.life / 12);
    ctx.fillStyle = pt.c;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* trail */
  var tl = ball.trail;
  for (var t = 0; t < tl.length; t++) {
    var tt = tl[t], k = t / tl.length;
    ctx.fillStyle = 'rgba(255,120,50,' + (0.16 * k).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(tt.x, tt.y, BALL_R * (0.4 + 0.6 * k), 0, TAU); ctx.fill();
  }

  drawBall();

  /* flash text */
  if (flashT > 0) {
    var prog = 1 - flashT / 55;
    var scale = prog < 0.18 ? 1 + 0.55 * (1 - prog / 0.18) : 1;
    var alpha = prog > 0.55 ? Math.max(0, 1 - (prog - 0.55) / 0.45) : 1;
    ctx.save();
    ctx.translate(W / 2, H * 0.32);
    ctx.rotate(-0.06);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.font = '900 italic 62px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(20,10,0,0.55)';
    ctx.strokeText('DUNK!', 0, 0);
    var fg = ctx.createLinearGradient(0, -40, 0, 20);
    fg.addColorStop(0, '#ffd36b');
    fg.addColorStop(1, '#ff6b2c');
    ctx.fillStyle = fg;
    ctx.fillText('DUNK!', 0, 0);
    ctx.restore();
  }

  ctx.restore();

  /* vignette */
  var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- main loop (fixed timestep) ---------- */
var last = performance.now(), acc = 0;
var STEP = 1000 / 60;
function loop(now) {
  requestAnimationFrame(loop);
  var dt = now - last;
  last = now;
  if (dt > 250) dt = 250;
  acc += dt;
  var steps = 0;
  while (acc >= STEP && steps < 5) {
    update();
    acc -= STEP;
    steps++;
  }
  draw();
}
requestAnimationFrame(loop);

/* ---------- init ---------- */
menuBestEl.textContent = best;
menuEl.classList.remove('hidden');

/* ---------- QA handle ---------- */
window.__T = {
  flap: flap, startGame: startGame,
  ranks: RANKS,
  setScoreForTest: function (s) { score = s; setMedal(); },
  get state() { return state; },
  get ball() { return ball; },
  get hoops() { return hoops; },
  get score() { return score; },
  get best() { return best; }
};

})();
</script>
</body>
</html>
